name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: asqgdgzxkdksoikmffmd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Supabase -> Account -> Access Tokens)."
            exit 1
          fi
      - run: supabase functions deploy create-subscription --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy verify-payment --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy cancel-subscription --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy razorpay-webhook --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy cleanup-files --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      # upload-pass was retired in v21: remove it from the project (no-op once it is gone)
      - run: supabase functions delete upload-pass --project-ref "$PROJECT_REF" --yes || true
      - run: supabase functions deploy finalize-order --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy reorder --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy admin-action --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy push-new-order --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy send-email --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy send-welcome --project-ref "$PROJECT_REF" --yes
