name: Auto-delete old files (backup)

on:
  schedule:
    # Main schedule is pg_cron in Supabase (every 15 min, see supabase/migrations/2026-11-17-v4-cleanup-cron.sql).
    # This is only a backup; GitHub's schedule is often late or skipped.
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node scripts/cleanup.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
