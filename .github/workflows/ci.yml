name: CI

# Runs on every pull request and on main pushes that touch supabase/ or scripts/ (and can be required in branch protection for main):
#  - web: type check + production build
#  - sql: fresh install on a throw-away local Supabase (schema.sql + every migration, twice)
on:
  pull_request:
  # Work goes straight to main, so also check database files on those pushes.
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.2.0   # pinned: "latest" needs a GitHub API lookup that sometimes fails
      - name: schema.sql is up to date with the migrations
        run: scripts/build-schema.sh && git diff --exit-code supabase/schema.sql || { echo "::error::Run scripts/build-schema.sh and commit supabase/schema.sql"; exit 1; }
      - run: scripts/local-supabase.sh
      - run: scripts/apply-sql.sh
