<svg xmlns="http://www.w3.org/2000/svg" width="160" height="132" viewBox="0 0 160 132" role="img" aria-label="Order done, thank you">
<style>
:root{--ink:#0e1628;--lime:#a6e22e;--brand:#3f6212;--wall:#f2fbe0;--wl:#c9ec8a;--hole:#23312a;--sill:#c9ec8a;--skin:#f2c39b;--skin2:#e2ab80;--hair:#2b2118;--shirt:#2f6fda}
@media(prefers-color-scheme:dark){:root{--wall:#17221b;--wl:#2c3d22;--sill:#2c3d22}}
.wall{fill:var(--wall);stroke:var(--wl);stroke-width:2}.hole{fill:var(--hole)}.sill{fill:var(--sill)}
.shirt{fill:var(--shirt)}.skin{fill:var(--skin)}.skin2{fill:var(--skin2)}.hair{fill:var(--hair)}
.bow{transform-box:view-box;transform-origin:72px 96px;animation:bow 5s ease-in-out infinite}
.hands{transform-box:view-box;transform-origin:72px 96px;animation:bow 5s ease-in-out infinite}
.eye{fill:none;stroke:#1b1410;stroke-width:1.9;stroke-linecap:round}
.brow{fill:none;stroke:var(--hair);stroke-width:1.6;stroke-linecap:round}
.smile{fill:#7a2e1c}.tongue{fill:#f08a8a}.blush{fill:#ff8a7a;opacity:.45}
.badge{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop 5s cubic-bezier(.3,1.4,.5,1) infinite}
.bf{fill:var(--lime);stroke:var(--ink);stroke-width:2}
.ck{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;animation:draw 5s ease-out infinite}
.rg{fill:none;stroke:var(--lime);stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center;animation:rg 5s ease-out infinite}
.rg.b{animation-delay:.18s}
.cf{opacity:0;transform-box:fill-box;transform-origin:center;animation:burst 5s ease-out infinite}
.ht{fill:#ff5f7e;opacity:0;transform-box:fill-box;transform-origin:center;animation:heart 5s ease-out infinite}
.ht.b{animation-delay:.35s}.ht.c{animation-delay:.7s}
@keyframes bow{0%,26%{transform:translateY(0) rotate(0)}34%,42%{transform:translateY(2.5px) rotate(5deg)}52%,100%{transform:translateY(0) rotate(0)}}
@keyframes pop{0%,8%{transform:scale(0)}15%{transform:scale(1.25)}20%,90%{transform:scale(1)}97%,100%{transform:scale(0)}}
@keyframes draw{0%,13%{stroke-dashoffset:16}24%,90%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:16}}
@keyframes rg{0%,10%{opacity:0;transform:scale(.6)}14%{opacity:.9}34%,100%{opacity:0;transform:scale(2.4)}}
@keyframes burst{0%,10%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}13%{opacity:1}42%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(240deg) scale(1)}68%,100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 16px)) rotate(420deg) scale(.9)}}
@keyframes heart{0%,38%{opacity:0;transform:translate(0,4px) scale(.4)}48%{opacity:1}80%,100%{opacity:0;transform:translate(var(--hx,0px),-22px) scale(1.2)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.badge{transform:scale(1)}.ck{stroke-dashoffset:0}}
</style>
<defs><clipPath id="w"><rect x="36" y="44" width="88" height="48" rx="4"/></clipPath></defs>
<rect class="wall" x="12" y="8" width="136" height="114" rx="14"/>
<rect class="hole" x="36" y="44" width="88" height="52" rx="5"/>
<g clip-path="url(#w)">
 <rect class="shirt" x="48" y="86" width="48" height="30" rx="14"/>
 <g class="bow">
  <circle class="skin" cx="72" cy="72" r="13"/>
  <path class="hair" d="M59 70c1-10 8-14 13-14s12 4 13 14c-4-4-9-5-13-5s-9 1-13 5z"/>
  <path class="brow" d="M64 67.500q3-2 6 0M74 67.500q3-2 6 0"/>
  <path class="eye" d="M64.500 73.500q2.500-3.500 5 0M74.500 73.500q2.500-3.500 5 0"/>
  <circle class="blush" cx="62" cy="77" r="2.600"/><circle class="blush" cx="82" cy="77" r="2.600"/>
  <path class="smile" d="M66.500 77.500q5.500 7 11 0z"/><path class="tongue" d="M69.500 80.500q2.500 2 5 0q-2.500-1.200-5 0z"/>
 </g>
 <g class="hands">
  <ellipse class="skin"  cx="70.200" cy="88" rx="3" ry="6.500" transform="rotate(12 70.200 88)"/>
  <ellipse class="skin2" cx="73.800" cy="88" rx="3" ry="6.500" transform="rotate(-12 73.800 88)"/>
 </g>
 <g class="badge"><circle class="bf" cx="104" cy="60" r="11"/><path class="ck" d="M98 60.500l4.500 4.500L111 55.500"/></g>
 <circle class="rg" cx="104" cy="60" r="11"/><circle class="rg b" cx="104" cy="60" r="11"/>
 <path class="ht"   style="--hx:-8px" transform="translate(58 76)" d="M0 3C-5-1-4-5-1.500-4.500-.5-4.300 0-3.500 0-3 0-3.500.5-4.300 1.500-4.500 4-5 5-1 0 3z"/>
 <path class="ht b" style="--hx:8px"  transform="translate(86 74)" d="M0 3C-5-1-4-5-1.500-4.500-.5-4.300 0-3.500 0-3 0-3.500.5-4.300 1.500-4.500 4-5 5-1 0 3z"/>
 <path class="ht c" style="--hx:0px"  transform="translate(72 64) scale(.8)" d="M0 3C-5-1-4-5-1.500-4.500-.5-4.300 0-3.500 0-3 0-3.500.5-4.300 1.500-4.500 4-5 5-1 0 3z"/>
</g>
<rect class="sill" x="26" y="92" width="108" height="10" rx="5"/>
<rect fill="#a6e22e" x="16" y="18" width="16" height="16"/><rect fill="#ffffff" x="32" y="18" width="16" height="16"/><rect fill="#a6e22e" x="48" y="18" width="16" height="16"/><rect fill="#ffffff" x="64" y="18" width="16" height="16"/><rect fill="#a6e22e" x="80" y="18" width="16" height="16"/><rect fill="#ffffff" x="96" y="18" width="16" height="16"/><rect fill="#a6e22e" x="112" y="18" width="16" height="16"/><rect fill="#ffffff" x="128" y="18" width="16" height="16"/><circle fill="#a6e22e" cx="24" cy="34" r="8"/><circle fill="#ffffff" cx="40" cy="34" r="8"/><circle fill="#a6e22e" cx="56" cy="34" r="8"/><circle fill="#ffffff" cx="72" cy="34" r="8"/><circle fill="#a6e22e" cx="88" cy="34" r="8"/><circle fill="#ffffff" cx="104" cy="34" r="8"/><circle fill="#a6e22e" cx="120" cy="34" r="8"/><circle fill="#ffffff" cx="136" cy="34" r="8"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#a6e22e" style="--dx:-34px;--dy:-20px;animation-delay:0.00s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ffb020" style="--dx:30px;--dy:-26px;animation-delay:0.02s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ff7a8a" style="--dx:-22px;--dy:26px;animation-delay:0.04s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#4da3ff" style="--dx:38px;--dy:16px;animation-delay:0.06s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ffffff" style="--dx:-44px;--dy:4px;animation-delay:0.08s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#a6e22e" style="--dx:10px;--dy:-36px;animation-delay:0.10s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ffb020" style="--dx:18px;--dy:32px;animation-delay:0.12s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ff7a8a" style="--dx:-12px;--dy:-32px;animation-delay:0.14s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#4da3ff" style="--dx:46px;--dy:-6px;animation-delay:0.16s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#a6e22e" style="--dx:-30px;--dy:12px;animation-delay:0.18s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ffffff" style="--dx:26px;--dy:-8px;animation-delay:0.20s"/><rect class="cf" x="102" y="57" width="3" height="5" rx=".8" fill="#ffb020" style="--dx:-6px;--dy:30px;animation-delay:0.22s"/>
</svg>
