<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 372 104" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Printer mascot printing an order slip">
<style>
:root{--body:#0e1628;--lid:#22304d;--feet:#070b16;--edge:rgba(255,255,255,0)}
@media(prefers-color-scheme:dark){:root{--body:#1b2a47;--lid:#2c3d63;--feet:#0e1628;--edge:rgba(166,226,46,.55)}}
.A{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.sq{transform-box:view-box;transform-origin:62px 92px;animation-name:sq}
.jit{animation-name:jit;animation-timing-function:linear}
.shadow{fill:#000;transform-box:view-box;transform-origin:62px 98px;animation-name:shadow}
.eye{transform-box:fill-box;transform-origin:center;animation-name:blink}
.pupil{animation-name:look}
.eyesN{animation-name:eyesN}.eyesH{animation-name:eyesH;opacity:0}
.mSmile{animation-name:mSmile}.mO{animation-name:mO;opacity:0}.mBig{animation-name:mBig;opacity:0}
.slot{fill:#a6e22e;opacity:0;animation-name:slot;animation-timing-function:linear}
.strip{fill:#fff;stroke:#d6d0c0;stroke-width:1.4;transform-box:fill-box;transform-origin:left center;animation-name:strip;animation-timing-function:linear}
.tip{animation-name:tip;animation-timing-function:linear}
.tipp{transform-box:fill-box;transform-origin:center;animation-name:tipp}
.mk{transform-box:fill-box;transform-origin:center;opacity:0}
.cf{opacity:0;transform-box:fill-box;transform-origin:center;animation-name:burst;animation-timing-function:ease-out}
.led{fill:#a6e22e;animation:led 1s ease-in-out infinite}
.bar{fill:#cfc9b8}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.strip{transform:scaleX(1)}.tip{transform:translateX(250px)}.mk{opacity:1}.eyesH,.mO,.mBig{opacity:0}}
@keyframes sq{0%{transform:scale(1,1)}8%{transform:scale(1.012,.99)}16%{transform:scale(1,1)}18%{transform:scale(1.06,.9)}20%{transform:scale(.97,1.04)}21%{transform:scale(1,1)}50%{transform:scale(1,1)}52%{transform:scale(1.07,.88)}55%{transform:translateY(-15px) scale(.94,1.09)}58%{transform:translateY(0) scale(1.09,.88)}61%{transform:scale(.98,1.03)}63%{transform:scale(1,1)}86%{transform:scale(1,1)}92%{transform:scale(1.01,.97)}100%{transform:scale(1,1)}}@keyframes jit{0%{transform:translateX(0)}20%{transform:translateX(0.7px)}21%{transform:translateX(-0.7px)}22%{transform:translateX(0.7px)}23%{transform:translateX(-0.7px)}24%{transform:translateX(0.7px)}25%{transform:translateX(-0.7px)}26%{transform:translateX(0.7px)}27%{transform:translateX(-0.7px)}28%{transform:translateX(0.7px)}29%{transform:translateX(-0.7px)}30%{transform:translateX(0.7px)}31%{transform:translateX(-0.7px)}32%{transform:translateX(0.7px)}33%{transform:translateX(-0.7px)}34%{transform:translateX(0.7px)}35%{transform:translateX(-0.7px)}36%{transform:translateX(0.7px)}37%{transform:translateX(-0.7px)}38%{transform:translateX(0.7px)}39%{transform:translateX(-0.7px)}40%{transform:translateX(0.7px)}41%{transform:translateX(-0.7px)}42%{transform:translateX(0.7px)}43%{transform:translateX(-0.7px)}44%{transform:translateX(0.7px)}45%{transform:translateX(-0.7px)}46%{transform:translateX(0.7px)}47%{transform:translateX(-0.7px)}48%{transform:translateX(0.7px)}49%{transform:translateX(-0.7px)}50.5%{transform:translateX(0)}70%{transform:translateX(0.7px)}71%{transform:translateX(-0.7px)}72%{transform:translateX(0.7px)}73%{transform:translateX(-0.7px)}74%{transform:translateX(0.7px)}75%{transform:translateX(-0.7px)}76%{transform:translateX(0.7px)}77%{transform:translateX(-0.7px)}78%{transform:translateX(0.7px)}79%{transform:translateX(-0.7px)}80.5%{transform:translateX(0)}100%{transform:translateX(0)}}@keyframes shadow{0%{transform:scale(1);opacity:.18}52%{transform:scale(1);opacity:.18}55%{transform:scale(.7);opacity:.08}58%{transform:scale(1.1);opacity:.22}62%{transform:scale(1);opacity:.18}100%{transform:scale(1);opacity:.18}}@keyframes blink{0%{transform:scaleY(1)}12%{transform:scaleY(1)}12.8%{transform:scaleY(.1)}13.6%{transform:scaleY(1)}30%{transform:scaleY(1)}30.8%{transform:scaleY(.1)}31.6%{transform:scaleY(1)}70%{transform:scaleY(1)}73%{transform:scaleY(.1)}74%{transform:scaleY(1)}86%{transform:scaleY(1)}90%{transform:scaleY(.3)}95%{transform:scaleY(.3)}97%{transform:scaleY(1)}100%{transform:scaleY(1)}}@keyframes look{0%{transform:translate(0,0)}5%{transform:translate(-2.4px,0)}8%{transform:translate(-2.4px,0)}10%{transform:translate(2.4px,0)}14%{transform:translate(2.4px,0)}17%{transform:translate(0,0)}20%{transform:translate(2.6px,.5px)}50%{transform:translate(2.6px,.5px)}53%{transform:translate(0,-1px)}66%{transform:translate(0,-1px)}72%{transform:translate(0,0)}80%{transform:translate(-2.4px,0)}86%{transform:translate(0,.8px)}100%{transform:translate(0,0)}}@keyframes eyesN{0%{opacity:1}53.9%{opacity:1}54%{opacity:0}65.9%{opacity:0}66%{opacity:1}100%{opacity:1}}@keyframes eyesH{0%{opacity:0}53.9%{opacity:0}54%{opacity:1}65.9%{opacity:1}66%{opacity:0}100%{opacity:0}}@keyframes mSmile{0%{opacity:1}19.9%{opacity:1}20%{opacity:0}53.9%{opacity:0}66%{opacity:0}66.1%{opacity:1}100%{opacity:1}}@keyframes mO{0%{opacity:0}19.9%{opacity:0}20%{opacity:1}49.9%{opacity:1}50%{opacity:0}69.9%{opacity:0}70%{opacity:1}79.9%{opacity:1}80%{opacity:0}100%{opacity:0}}@keyframes mBig{0%{opacity:0}53.9%{opacity:0}54%{opacity:1}65.9%{opacity:1}66%{opacity:0}100%{opacity:0}}@keyframes slot{0%{opacity:0}19.9%{opacity:0}20%{opacity:.9}30%{opacity:.5}40%{opacity:.9}50%{opacity:.9}51%{opacity:0}69.9%{opacity:0}70%{opacity:.8}80%{opacity:.8}81%{opacity:0}100%{opacity:0}}@keyframes strip{0%{transform:scaleX(0)}20%{transform:scaleX(0)}50%{transform:scaleX(1)}70%{transform:scaleX(1)}80%{transform:scaleX(0)}100%{transform:scaleX(0)}}@keyframes tip{0%{transform:translateX(0)}20%{transform:translateX(0)}50%{transform:translateX(250px)}70%{transform:translateX(250px)}80%{transform:translateX(0)}100%{transform:translateX(0)}}@keyframes tipp{0%{transform:scale(1) rotate(0)}50%{transform:scale(1) rotate(0)}52.5%{transform:scale(1.4) rotate(-12deg)}55%{transform:scale(1) rotate(8deg)}57%{transform:scale(1) rotate(0)}100%{transform:scale(1) rotate(0)}}@keyframes mk1{0%{opacity:0;transform:scale(0)}24.12%{opacity:0;transform:scale(0)}25.12%{opacity:1;transform:scale(1.25)}26.12%{opacity:1;transform:scale(1)}78.26%{opacity:1;transform:scale(1)}78.86%{opacity:0;transform:scale(.4)}100%{opacity:0;transform:scale(0)}}@keyframes mk2{0%{opacity:0;transform:scale(0)}29.16%{opacity:0;transform:scale(0)}30.16%{opacity:1;transform:scale(1.25)}31.16%{opacity:1;transform:scale(1)}76.58%{opacity:1;transform:scale(1)}77.18%{opacity:0;transform:scale(.4)}100%{opacity:0;transform:scale(0)}}@keyframes mk3{0%{opacity:0;transform:scale(0)}34.68%{opacity:0;transform:scale(0)}35.68%{opacity:1;transform:scale(1.25)}36.68%{opacity:1;transform:scale(1)}74.74%{opacity:1;transform:scale(1)}75.34%{opacity:0;transform:scale(.4)}100%{opacity:0;transform:scale(0)}}@keyframes mk4{0%{opacity:0;transform:scale(0)}40.2%{opacity:0;transform:scale(0)}41.2%{opacity:1;transform:scale(1.25)}42.2%{opacity:1;transform:scale(1)}72.9%{opacity:1;transform:scale(1)}73.5%{opacity:0;transform:scale(.4)}100%{opacity:0;transform:scale(0)}}@keyframes mk5{0%{opacity:0;transform:scale(0)}44.76%{opacity:0;transform:scale(0)}45.76%{opacity:1;transform:scale(1.25)}46.76%{opacity:1;transform:scale(1)}71.38%{opacity:1;transform:scale(1)}71.98%{opacity:0;transform:scale(.4)}100%{opacity:0;transform:scale(0)}}@keyframes burst{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}51.5%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}52.5%{opacity:1}60%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(1)}68%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 14px)) rotate(380deg) scale(.9)}100%{opacity:0}}@keyframes led{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}</style>
<ellipse class="shadow A" cx="62" cy="98" rx="44" ry="4"/>
<!-- paper behind the printer -->
<rect class="strip A" x="84" y="52" width="250" height="22" rx="3"/>
<g transform="translate(120 63)"><g class="mk A" style="animation-name:mk1"><rect class="bar" x="-12" y="-6" width="24" height="3.400" rx="1.700"/><rect class="bar" x="-12" y="1" width="15" height="3.400" rx="1.700"/></g></g><g transform="translate(162 63)"><g class="mk A" style="animation-name:mk2"><rect x="-8" y="-8" width="16" height="16" rx="1.500" fill="#fff" stroke="#0e1628" stroke-width="1.600"/><rect x="-5.500" y="-5.500" width="5" height="5" fill="#0e1628"/><rect x="1" y="-5.500" width="4.500" height="4.500" fill="#0e1628"/><rect x="-5.500" y="1" width="4.500" height="4.500" fill="#0e1628"/><rect x="1.500" y="1.500" width="3" height="3" fill="#0e1628"/></g></g><g transform="translate(208 63)"><g class="mk A" style="animation-name:mk3"><rect class="bar" x="-12" y="-6" width="22" height="3.400" rx="1.700"/><rect class="bar" x="-12" y="1" width="30" height="3.400" rx="1.700"/></g></g><g transform="translate(254 63)"><g class="mk A" style="animation-name:mk4"><path d="M0 6C-9 0-8-8-3.500-7.500-1.500-7.200 0-5.500 0-4.500 0-5.500 1.500-7.200 3.500-7.500 8-8 9 0 0 6z" fill="#ff5f7e"/></g></g><g transform="translate(292 63)"><g class="mk A" style="animation-name:mk5"><path d="M0-8L2.200-2.200 8 0 2.200 2.200 0 8-2.200 2.200-8 0-2.200-2.200z" fill="#ffb020"/></g></g>
<g transform="translate(84 63)"><g class="tip A"><g class="tipp A"><circle r="12" fill="#a6e22e" stroke="#0e1628" stroke-width="2.400"/><path d="M-5.500 .5l4 4 7-8" fill="none" stroke="#0e1628" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
<g><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#a6e22e" style="--dx:-26px;--dy:-26px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#ffb020" style="--dx:24px;--dy:-30px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#ff7a8a" style="--dx:-34px;--dy:-4px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#4da3ff" style="--dx:34px;--dy:-8px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#ffb020" style="--dx:-12px;--dy:-34px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#ff7a8a" style="--dx:10px;--dy:-36px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#a6e22e" style="--dx:30px;--dy:14px"/><rect class="cf" x="332" y="61" width="3.600" height="6" rx="1" fill="#4da3ff" style="--dx:-28px;--dy:12px"/></g>
<!-- printer -->
<g class="jit A"><g class="sq A">
 <rect x="24" y="90" width="18" height="7" rx="3.500" fill="var(--feet)"/><rect x="82" y="90" width="18" height="7" rx="3.500" fill="var(--feet)"/>
 <rect x="14" y="30" width="96" height="62" rx="16" fill="var(--body)" stroke="var(--edge)" stroke-width="1.600"/>
 <path d="M14 46a16 16 0 0 1 16-16h64a16 16 0 0 1 16 16z" fill="var(--lid)"/>
 <path d="M26 38h14M26 42h10" stroke="#000" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"/><circle class="led" cx="98" cy="38" r="2.800"/>
 <rect class="slot A" x="106" y="50" width="4.500" height="26" rx="2"/>
 <circle cx="34" cy="71" r="4.200" fill="#ff8a7a" opacity=".5"/><circle cx="90" cy="71" r="4.200" fill="#ff8a7a" opacity=".5"/>
 <g class="eyesN A">
  <g class="eye A"><rect x="39.500" y="49.500" width="13" height="17" rx="6.500" fill="#a6e22e"/><circle class="pupil A" cx="46" cy="58" r="3.400" fill="#0e1628"/></g>
  <g class="eye A"><rect x="71.500" y="49.500" width="13" height="17" rx="6.500" fill="#a6e22e"/><circle class="pupil A" cx="78" cy="58" r="3.400" fill="#0e1628"/></g>
 </g>
 <g class="eyesH A" fill="none" stroke="#a6e22e" stroke-width="3.600" stroke-linecap="round"><path d="M40 62q6-10 12 0M72 62q6-10 12 0"/></g>
 <path class="mSmile A" d="M54 74q8 7 16 0" fill="none" stroke="#a6e22e" stroke-width="3" stroke-linecap="round"/>
