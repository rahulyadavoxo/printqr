<svg xmlns="http://www.w3.org/2000/svg" width="160" height="132" viewBox="0 0 160 132" role="img" aria-label="Waiting for a customer to scan the QR" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root { --ink:#0e1628; --lime:#a6e22e; --brand:#3f6212; --card:#ffffff; --counter:#c9ec8a; --counter2:#a6cf5a; --amber:#ffb020; --pot:#c2703d; --leaf:#4c9a2a; --leaf2:#65a30d; --sign:#ffb020; }
    @media (prefers-color-scheme: dark) { :root { --card:#e9efe3; --counter:#2c3d22; --counter2:#22301b; } }

    .counter  { fill:var(--counter); }
    .counter2 { fill:var(--counter2); }

    /* QR standee */
    .leg      { fill:var(--brand); }
    .card     { fill:var(--card); stroke:var(--brand); stroke-width:2.2; }
    .qr       { fill:var(--ink); }
    .fnd      { fill:none; stroke:var(--ink); stroke-width:2.2; }
    .tw       { fill:var(--ink); animation:tw 2.8s ease-in-out infinite; }
    .tw.b     { animation-delay:.7s; }
    .tw.c     { animation-delay:1.4s; }
    .tw.d     { animation-delay:2.1s; }
    .label    { fill:var(--brand); font:800 7px system-ui,sans-serif; letter-spacing:1.2px; text-anchor:middle; }
    .focus    { fill:none; stroke:var(--lime); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; transform-box:view-box; transform-origin:80px 68px; animation:focus 2.8s ease-in-out infinite; }

    /* hanging OPEN sign */
    .hook     { fill:var(--ink); }
    .swing    { transform-box:view-box; transform-origin:26px 22px; animation:swing 4.5s ease-in-out infinite; }
    .chain    { stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; }
    .sign     { fill:var(--sign); stroke:var(--ink); stroke-width:1.8; }
    .signt    { fill:var(--ink); font:800 9px system-ui,sans-serif; letter-spacing:1px; text-anchor:middle; }

    /* plant */
    .pot      { fill:var(--pot); }
    .leaf     { fill:var(--leaf); transform-box:fill-box; transform-origin:bottom center; animation:sway 5s ease-in-out infinite; }
    .leaf.b   { fill:var(--leaf2); animation-delay:-1.6s; }
    .leaf.c   { animation-delay:-3.2s; }

    @keyframes tw    { 0%,100%{ opacity:1; } 50%{ opacity:.12; } }
    @keyframes focus { 0%,100%{ opacity:.25; transform:scale(.94); } 50%{ opacity:1; transform:scale(1.04); } }
    @keyframes swing { 0%,100%{ transform:rotate(-7deg); } 50%{ transform:rotate(7deg); } }
    @keyframes sway  { 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(5deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <!-- counter -->
  <rect class="counter"  x="10" y="104" width="140" height="12" rx="6"/>
  <rect class="counter2" x="10" y="112" width="140" height="4" rx="2"/>

  <!-- focus brackets (waiting to be scanned) -->
  <g class="focus">
    <path d="M52 46V38h8"/>
    <path d="M108 46V38h-8"/>
    <path d="M52 90v8h8"/>
    <path d="M108 90v8h-8"/>
  </g>

  <!-- QR standee -->
  <path class="leg" d="M72 96h16l5 8H67z"/>
  <rect class="card" x="58" y="42" width="44" height="54" rx="6"/>

  <!-- QR code -->
  <rect class="fnd" x="64.500" y="48.500" width="9" height="9"/>
  <rect class="qr"  x="67" y="51" width="4" height="4"/>
  <rect class="fnd" x="86.500" y="48.500" width="9" height="9"/>
  <rect class="qr"  x="89" y="51" width="4" height="4"/>
  <rect class="fnd" x="64.500" y="70.500" width="9" height="9"/>
  <rect class="qr"  x="67" y="73" width="4" height="4"/>
  <rect class="qr"  x="77" y="48" width="4" height="4"/>
  <rect class="tw"   x="77" y="54" width="4" height="4"/>
  <rect class="qr"  x="82" y="59" width="4" height="4"/>
  <rect class="tw b" x="64" y="60" width="4" height="4"/>
  <rect class="qr"  x="72" y="60" width="4" height="4"/>
  <rect class="tw c" x="90" y="62" width="4" height="4"/>
  <rect class="qr"  x="77" y="66" width="4" height="4"/>
  <rect class="tw d" x="85" y="68" width="4" height="4"/>
  <rect class="qr"  x="91" y="72" width="4" height="4"/>
  <rect class="tw"   x="79" y="74" width="4" height="4"/>
  <rect class="qr"  x="85" y="76" width="4" height="4"/>
  <rect class="tw b" x="72" y="68" width="4" height="4"/>
  <text class="label" x="80" y="90">SCAN</text>

  <!-- hanging OPEN sign -->
  <rect class="hook" x="14" y="20" width="24" height="4" rx="2"/>
  <g class="swing">
    <line class="chain" x1="20" y1="24" x2="20" y2="38"/>
    <line class="chain" x1="32" y1="24" x2="32" y2="38"/>
    <rect class="sign" x="8" y="38" width="36" height="18" rx="4"/>
    <text class="signt" x="26" y="50.500">OPEN</text>
  </g>

  <!-- plant -->
  <path class="leaf"   d="M128 94C122 86 122 78 126 72C131 78 132 87 128 94Z"/>
  <path class="leaf b" d="M130 94C132 86 138 80 144 80C142 88 137 93 130 94Z"/>
  <path class="leaf c" d="M126 94C120 92 116 88 114 82C121 82 126 87 126 94Z"/>
  <path class="pot" d="M118 93h20l-3 11h-14z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
