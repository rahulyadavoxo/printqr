.pa{animation-name:pa;animation-timing-function:linear}
.pb{transform-box:fill-box;transform-origin:center;opacity:0;animation-name:pb}
.led{fill:#a6e22e;animation-name:led;animation-timing-function:linear}
.ht{opacity:0;transform-box:fill-box;transform-origin:center}
