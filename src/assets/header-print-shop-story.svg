.A{animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.L{animation-timing-function:linear}
.cx{animation-name:cx;animation-timing-function:linear}
.cflip{transform-box:view-box;transform-origin:200px 60px;animation-name:cflip;animation-timing-function:linear}
