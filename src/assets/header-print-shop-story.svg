<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 372 104" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Customer scans the shop QR, the shopkeeper prints and hands over the order">
<style>
:root{--ink:#0e1628;--bgb:#ffffff}
