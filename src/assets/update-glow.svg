<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 360 792" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Update available" xmlns:c2pa="http://c2pa.org/manifest">
<style>
:root{--bg:#f4f2ee;--ink:#0c1411;--lime:#a6e22e;--edge:rgba(12,20,17,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1410;--edge:rgba(166,226,46,.35)}}
.bg{fill:var(--bg)}
.glow{transform-box:view-box;transform-origin:180px 312px;animation:glow 3.6s ease-in-out infinite}
.swell{animation:swell 5s ease-in-out infinite alternate}
.ring{fill:none;stroke:var(--lime);stroke-width:2.2;opacity:0;transform-box:view-box;transform-origin:180px 312px;animation:ring 3.6s ease-out infinite}
.ring.b{animation-delay:1.2s}.ring.c{animation-delay:2.4s}
.rise{opacity:0;animation:rise linear infinite}
.sway{animation:sway ease-in-out infinite alternate}
.shadow{fill:#0c1411;opacity:.14;transform-box:fill-box;transform-origin:center;animation:shadow 2.4s ease-in-out infinite}
.icon{animation:float 2.4s ease-in-out infinite}
.tile{fill:var(--ink);stroke:var(--edge);stroke-width:1.5}
.arrow{fill:none;stroke:var(--lime);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;animation:arrow 2.4s cubic-bezier(.6,0,.3,1) infinite}
.sp{fill:var(--lime);transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.sp.b{animation-delay:.6s}.sp.c{animation-delay:1.2s}.sp.d{animation-delay:1.8s}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes swell{from{opacity:.5;transform:translateY(8px)}to{opacity:.95;transform:translateY(-6px)}}
@keyframes ring{0%{opacity:.75;transform:scale(.35)}100%{opacity:0;transform:scale(5)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(-850px);opacity:0}}
@keyframes sway{from{transform:translateX(calc(var(--sw)*-1))}to{transform:translateX(var(--sw))}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.14}50%{transform:scale(.8);opacity:.08}}
@keyframes arrow{0%,35%{transform:translateY(0);opacity:1}58%{transform:translateY(-46px);opacity:0}59%{transform:translateY(46px);opacity:0}80%,100%{transform:translateY(0);opacity:1}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.4)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:0}.ring{opacity:.25;transform:scale(2)}}
</style>
