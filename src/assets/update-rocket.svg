<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 360 792" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Update available" xmlns:c2pa="http://c2pa.org/manifest">
<style>
:root{--t:#9fcdff;--m:#d4e9ff;--b:#f5f9ff;--cloud:#ffffff;--line:#ffffff;--sun:#ffe08a}
@media(prefers-color-scheme:dark){:root{--t:#0a1430;--m:#16255a;--b:#26387a;--cloud:#8ea4d8;--line:#a9bcf0;--sun:#5a6cb0}}
.cl{fill:var(--cloud);animation:cloud linear infinite}
.sl{stroke:var(--line);stroke-width:1.6;stroke-linecap:round;opacity:0;animation:line linear infinite}
.sun{fill:var(--sun);opacity:.95;transform-box:fill-box;transform-origin:center;animation:sun 5s ease-in-out infinite}
.fl{transform-box:view-box;transform-origin:180px 296px;animation:rocketfloat 2.6s ease-in-out infinite}
.jt{animation:jit .14s steps(2) infinite}
.fire{transform-box:view-box;transform-origin:180px 296px;animation:flick .18s ease-in-out infinite alternate}
.fire2{transform-box:view-box;transform-origin:180px 296px;animation:flick .13s ease-in-out infinite alternate-reverse}
.puff{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 1.8s ease-out infinite}
.puff.b{animation-delay:.3s}.puff.c{animation-delay:.6s}.puff.d{animation-delay:.9s}.puff.e{animation-delay:1.2s}.puff.f{animation-delay:1.5s}
.sp{fill:#fff;transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.sp.b{animation-delay:.6s;fill:#ffd54a}.sp.c{animation-delay:1.2s}.sp.d{animation-delay:1.8s;fill:#ffd54a}
@keyframes cloud{0%{transform:translateY(-120px)}100%{transform:translateY(900px)}}
@keyframes line{0%{opacity:0;transform:translateY(-60px)}15%{opacity:.75}85%{opacity:.75}100%{opacity:0;transform:translateY(860px)}}
@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rocketfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jit{0%{transform:translate(-.5px,0)}100%{transform:translate(.5px,.4px)}}
@keyframes flick{from{transform:scale(.92,.82)}to{transform:scale(1.08,1.18)}}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.85}100%{opacity:0;transform:translate(var(--dx,0px),210px) scale(2.6)}}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.4)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
