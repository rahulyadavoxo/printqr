<svg xmlns="http://www.w3.org/2000/svg" width="72" height="100" viewBox="44 12 72 100" role="img" aria-label="In progress">
  <style>
    :root { --ink:#0e1628; --lime:#a6e22e; --brand:#3f6212; --sand:#ffb020; --sand2:#ffcf66; --glassfill:#f2fbe0; --cap:#0e1628; }
    @media (prefers-color-scheme: dark) { :root { --glassfill:#17221b; --cap:#c9ec8a; --ink:#c9ec8a; } }

    .ring   { fill:none; stroke:var(--lime); stroke-width:2; opacity:0; transform-box:view-box; transform-origin:80px 62px; animation:ring 3.6s ease-out infinite; }
    .ring.b { animation-delay:1.2s; }
    .ring.c { animation-delay:2.4s; }

    .flip   { transform-box:view-box; transform-origin:80px 62px; animation:flip 9s cubic-bezier(.6,0,.3,1) infinite; }
    .glass  { fill:var(--glassfill); stroke:var(--ink); stroke-width:2.4; stroke-linejoin:round; }
    .cap    { fill:var(--cap); }
    .sandT  { fill:var(--sand); transform-box:view-box; transform-origin:80px 62px; animation:top 9s linear infinite; }
    .sandB  { fill:var(--sand); transform-box:view-box; transform-origin:80px 102px; animation:bot 9s linear infinite; }
    .shineS { fill:var(--sand2); opacity:.7; }
    .stream { stroke:var(--sand); stroke-width:2; stroke-linecap:round; stroke-dasharray:3 4; animation:fall .5s linear infinite, vis 9s linear infinite; }
    .shine  { fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; opacity:.55; }

    .dot    { fill:var(--brand); animation:dot 1.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .dot:nth-of-type(2){ animation-delay:.25s; }
    .dot:nth-of-type(3){ animation-delay:.5s; }

    @keyframes ring { 0%{ opacity:.7; transform:scale(.35); } 100%{ opacity:0; transform:scale(1.15); } }
    @keyframes top  { 0%{ transform:scaleY(1); } 82%,100%{ transform:scaleY(0); } }
    @keyframes bot  { 0%{ transform:scaleY(0); } 82%,100%{ transform:scaleY(1); } }
    @keyframes vis  { 0%,81%{ opacity:1; } 83%,100%{ opacity:0; } }
    @keyframes fall { to { stroke-dashoffset:-7; } }
    @keyframes flip { 0%,88%{ transform:rotate(0); } 100%{ transform:rotate(180deg); } }
    @keyframes dot  { 0%,100%{ transform:translateY(0); opacity:.35; } 40%{ transform:translateY(-4px); opacity:1; } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .sandT{ transform:scaleY(.5);} .sandB{ transform:scaleY(.5);} .ring{ opacity:.25; transform:scale(.7);} }
  </style>

  <defs>
    <path id="g" d="M54 24H106C106 42 85 52 83 62C85 72 106 82 106 100H54C54 82 75 72 77 62C75 52 54 42 54 24Z"/>
    <clipPath id="cg"><use href="#g"/></clipPath>
    <clipPath id="ct"><rect x="40" y="20" width="80" height="42"/></clipPath>
    <clipPath id="cb"><rect x="40" y="62" width="80" height="42"/></clipPath>
  </defs>

  <!-- hourglass (flips when sand runs out) -->
  <g class="flip">
    <use class="glass" href="#g"/>
    <g clip-path="url(#cg)">
      <g clip-path="url(#ct)"><rect class="sandT" x="50" y="22" width="60" height="40"/></g>
      <g clip-path="url(#cb)"><rect class="sandB" x="50" y="62" width="60" height="40"/></g>
    </g>
    <line class="stream" x1="80" y1="62" x2="80" y2="98"/>
    <path class="shine" d="M60 30C60 40 66 46 70 52"/>
    <rect class="cap" x="48" y="17" width="64" height="7" rx="3.500"/>
    <rect class="cap" x="48" y="100" width="64" height="7" rx="3.500"/>
  </g>
</svg>
