<svg xmlns="http://www.w3.org/2000/svg" width="160" height="132" viewBox="0 0 160 132" role="img" aria-label="Ready to collect" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    :root { --ink:#0e1628; --ink2:#2f3a50; --lime:#a6e22e; --brand:#3f6212; --brand50:#f2fbe0; --brand200:#c9ec8a; --paper:#ffffff; --line:#d6d2c7; --amber:#ffb020; }
    @media (prefers-color-scheme: dark) { :root { --paper:#e9efe3; --brand50:#17221b; --line:#9aa58f; } }

    .shadow   { fill:#0e1628; opacity:.12; transform-box:fill-box; transform-origin:center; animation:sh 6s ease-in-out infinite; }
    .body     { fill:var(--ink); }
    .top      { fill:var(--ink2); }
    .tray     { fill:var(--brand); }
    .slot     { fill:#000; opacity:.55; }
    .led      { fill:var(--lime); animation:led 1.2s ease-in-out infinite; }
    .led2     { fill:var(--amber); opacity:.9; }
    .screen   { fill:var(--brand50); }
    .dot      { fill:var(--brand); transform-box:fill-box; transform-origin:center; animation:dot 1.5s ease-in-out infinite; }
    .dot:nth-of-type(2){ animation-delay:.25s; }
    .dot:nth-of-type(3){ animation-delay:.5s; }

    .paper    { fill:var(--paper); stroke:var(--line); stroke-width:1; animation:feed 6s cubic-bezier(.4,0,.2,1) infinite; }
    .pl       { stroke:var(--line); stroke-width:2; stroke-linecap:round; animation:feed 6s cubic-bezier(.4,0,.2,1) infinite; }
    .pq       { fill:var(--brand); animation:feed 6s cubic-bezier(.4,0,.2,1) infinite; }

    .bell     { transform-box:view-box; transform-origin:130px 22px; animation:ring 6s ease-in-out infinite; }
    .bell-b   { fill:var(--amber); }
    .bell-h   { fill:#ffcf66; }
    .clap     { fill:var(--ink); transform-box:fill-box; transform-origin:top center; animation:clap 6s ease-in-out infinite; }
    .ding     { fill:none; stroke:var(--amber); stroke-width:2.4; stroke-linecap:round; opacity:0; animation:ding 6s ease-out infinite; }
    .ding.b   { animation-delay:.12s; }
    .ding.l   { transform-box:view-box; transform-origin:130px 36px; }
    .spark    { fill:var(--lime); opacity:0; transform-box:fill-box; transform-origin:center; animation:spark 6s ease-out infinite; }

    @keyframes feed {
      0%,6%     { transform:translateY(0); }
      12%,16%   { transform:translateY(-10px); }
      22%,26%   { transform:translateY(-20px); }
      32%,36%   { transform:translateY(-30px); }
      42%,82%   { transform:translateY(-34px); }
      94%,100%  { transform:translateY(0); }
    }
    @keyframes ring {
      0%,40%    { transform:rotate(0); }
      43%       { transform:rotate(16deg); }
      47%       { transform:rotate(-14deg); }
      51%       { transform:rotate(10deg); }
      55%       { transform:rotate(-6deg); }
      59%       { transform:rotate(3deg); }
      63%,100%  { transform:rotate(0); }
    }
    @keyframes clap {
      0%,40%    { transform:rotate(0); }
      44%       { transform:rotate(-26deg); }
      50%       { transform:rotate(20deg); }
      56%       { transform:rotate(-10deg); }
      62%,100%  { transform:rotate(0); }
    }
    @keyframes ding {
      0%,41%    { opacity:0; transform:scale(.7); }
      45%       { opacity:1; }
      62%,100%  { opacity:0; transform:scale(1.25); }
    }
    @keyframes spark {
      0%,42%    { opacity:0; transform:scale(0); }
      48%       { opacity:1; transform:scale(1); }
      62%,100%  { opacity:0; transform:scale(.4) translateY(-4px); }
    }
    @keyframes led { 0%,100%{ opacity:.35; } 50%{ opacity:1; } }
    @keyframes dot { 0%,100%{ transform:translateY(0); opacity:.4; } 40%{ transform:translateY(-3px); opacity:1; } }
    @keyframes sh  { 0%,100%{ transform:scaleX(1); } 50%{ transform:scaleX(.93); } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .paper,.pl,.pq { transform:translateY(-34px); } }
  </style>

  <defs>
    <clipPath id="above"><rect x="0" y="0" width="160" height="62"/></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse class="shadow" cx="80" cy="118" rx="46" ry="5"/>

  <!-- paper receipt coming out of the slot -->
  <g clip-path="url(#above)">
    <rect class="paper" x="58" y="58" width="44" height="52" rx="3"/>
    <rect class="pq" x="64" y="63" width="12" height="12" rx="2"/>
    <path class="pq" d="M66 65h3v3h-3zM71 65h3v3h-3zM66 70h3v3h-3zM71 70h3v3h-3z" fill="#fff" opacity=".0"/>
    <line class="pl" x1="82" y1="66" x2="96" y2="66"/>
    <line class="pl" x1="82" y1="72" x2="92" y2="72"/>
    <line class="pl" x1="64" y1="82" x2="96" y2="82"/>
    <line class="pl" x1="64" y1="88" x2="90" y2="88"/>
    <line class="pl" x1="64" y1="94" x2="96" y2="94"/>
  </g>

  <!-- printer -->
  <rect class="top"  x="34" y="56" width="92" height="12" rx="6"/>
  <rect class="slot" x="52" y="59" width="56" height="4" rx="2"/>
  <rect class="body" x="28" y="64" width="104" height="46" rx="12"/>
  <rect class="screen" x="40" y="76" width="38" height="16" rx="5"/>
  <circle class="dot" cx="50" cy="84" r="2.4"/>
  <circle class="dot" cx="59" cy="84" r="2.4"/>
  <circle class="dot" cx="68" cy="84" r="2.4"/>
  <circle class="led"  cx="96"  cy="80" r="3.2"/>
  <circle class="led2" cx="108" cy="80" r="3.2"/>
  <rect class="tray" x="40" y="98" width="80" height="6" rx="3"/>

  <!-- bell -->
  <g class="bell">
    <rect x="128" y="10" width="4" height="6" rx="1.5" fill="#ffcf66"/>
    <path class="bell-b" d="M130 15c-8 0-12 6-12 14v6l-4 5h32l-4-5v-6c0-8-4-14-12-14z"/>
    <path class="bell-h" d="M124 24c1-4 3-6 6-7-4 1-7 4-8 9-.2 1.200 1.400 0 2-2z"/>
    <circle class="clap" cx="130" cy="44" r="3.6"/>
  </g>
  <path class="ding l" d="M108 28q-5 7 0 14"/>
  <path class="ding l b" d="M101 24q-8 11 0 22"/>
  <path class="ding l" d="M152 28q5 7 0 14" transform="translate(0 0)"/>
  <path class="ding l b" d="M159 24q8 11 0 22" transform="translate(-2 0)"/>
  <circle class="spark" cx="118" cy="12" r="2.2"/>
  <circle class="spark" cx="144" cy="14" r="1.8" style="animation-delay:.1s"/>
  <circle class="spark" cx="150" cy="52" r="2" style="animation-delay:.18s"/>
</svg>
