// PrintQR Android app: the web app is bundled in assets/www (copied from dist/ by apps.yml),
// so the app never loads print.receipto.in. Website changes reach the app with a new APK (push an app-v* tag).
plugins {
    id 'com.android.application'
}

// Push notifications: apps.yml writes google-services.json from the GOOGLE_SERVICES_JSON secret.
// Without it the app still builds; push simply stays off.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def ks = System.getenv('PQ_KEYSTORE')

android {
    namespace 'com.receipto.print'
    compileSdk 36

    defaultConfig {
        applicationId 'in.receipto.print'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('PQ_VERSION_CODE') ?: '1')
        versionName System.getenv('PQ_VERSION_NAME') ?: '1.0.0'
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('PQ_KEY_PASS')
                keyAlias 'upload'
                keyPassword System.getenv('PQ_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.razorpay:checkout:1.6.41'
    implementation 'androidx.core:core:1.13.1'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Razorpay pulls old kotlin-stdlib-jdk7/jdk8; the BOM aligns them with androidx (no duplicate classes)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
